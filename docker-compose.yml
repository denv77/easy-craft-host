version: "2.0"

services:
  bff:
    image: easy-craft-bff:latest
    container_name: easy-craft-bff
    networks:
      - easy-craft-network # Connect to common network
    ports:
      - "127.0.0.1:9090:8080"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m

networks:
  easy-craft-network:
    external: true  # Network alredy present on host

